<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Adquirência e Banco</title>
<style>
:root{
  color-scheme:light;
  --page:#f3f3f1; --surface:#fcfcfb; --surface-2:#f5f5f3; --line:#e4e3df; --grid:#ecebe7;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#85847f;
  --brand:#1f3864; --brand-ink:#ffffff; --band:#d9e1f2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#006300; --bad:#d03b3b; --warn:#9a6700;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --page:#121211; --surface:#1a1a19; --surface-2:#222221; --line:#33332f; --grid:#2a2a27;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86; --brand:#16254a; --band:#26324f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --bad:#e66767; --warn:#fab219;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121211; --surface:#1a1a19; --surface-2:#222221; --line:#33332f; --grid:#2a2a27;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86; --brand:#16254a; --band:#26324f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --bad:#e66767; --warn:#fab219;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:14px 20px}
header .top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.meta{font-size:12px;opacity:.85;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:99px;font-weight:600;font-size:12px;background:rgba(255,255,255,.16)}
.badge.stale{background:#fab219;color:#3a2a00}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:inherit;border:0;padding:6px 12px;cursor:pointer;font:inherit}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand);font-weight:600}
select,input[type=search],input[type=number]{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
header select{border-color:rgba(255,255,255,.35)}
header label{font-size:12px;opacity:.9;display:flex;gap:6px;align-items:center}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
nav{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:20}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;color:var(--ink-2);font:inherit;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--s1);font-weight:600}
main{padding:18px 20px 40px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-3)}
.kpi .d b{font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px}
.card .sub{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.linkbtn{background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:4px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;vertical-align:3px;border-radius:2px;width:14px}
svg text{fill:var(--ink-3);font-size:11px;font-family:inherit}
svg .ax{stroke:var(--grid);stroke-width:1}
svg .zero{stroke:var(--ink-3);stroke-width:1;opacity:.6}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:7px 10px;font-size:12px;z-index:10;white-space:nowrap;display:none}
.tip .t{font-weight:600;margin-bottom:3px}
.tip div i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 230px)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;background:var(--surface)}
th{position:sticky;top:0;background:var(--band);color:var(--ink);font-weight:700;z-index:3}
td.txt,th.txt{text-align:left}
td.mut{color:var(--ink-3)}
tr.sec td{background:var(--surface-2);font-weight:700;text-align:left;cursor:pointer;position:sticky;left:0}
tr.sec td.sticky{z-index:2}
.sticky{position:sticky;z-index:2}
td.c0{left:0;min-width:230px;max-width:360px;white-space:normal;text-align:left}
td.c1{left:230px;color:var(--ink-3);font-size:11px;text-align:left;border-right:1px solid var(--line)}
th.c0{left:0;z-index:4} th.c1{left:230px;z-index:4;border-right:1px solid var(--line)}
td.wk{background:var(--surface-2);font-weight:600} td.mo{background:var(--band);font-weight:700}
th.wk{background:var(--surface-2)}
td.sat{background:var(--surface-2)}
th.sortable{cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:13px}
.filters label{display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--ink-2)}
.chip b{display:block;font-size:18px;color:var(--ink)}
.note{font-size:12px;color:var(--ink-3);margin:8px 0}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.w{color:var(--warn)} .pill.b{color:var(--bad)} .pill.g{color:var(--good)}
.hbar{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.hbar .tr{height:12px;background:var(--surface-2);border-radius:0 6px 6px 0}
.hbar .fl{height:12px;background:var(--s1);border-radius:0 6px 6px 0}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
@media (max-width:640px){main{padding:12px}.hbar{grid-template-columns:110px 1fr 44px}}
@media print{nav,.controls,.linkbtn{display:none}header{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>REPORT BANCO E ADQUIRÊNCIA — BCJ</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="controls" id="controls">
    <div class="seg" id="segBlock" role="group" aria-label="Bloco">
      <button data-b="interna">Interno (todos)</button><button data-b="franquias">Franquias</button>
    </div>
    <label>Mês <select id="selMonth"></select></label>
    <button class="iconbtn" id="btnTheme" title="Alternar tema claro/escuro">◐ Tema</button>
  </div>
</header>
<nav id="tabs" role="tablist">
  <button data-t="geral">Visão geral</button>
  <button data-t="report">Report (tabela)</button>
  <button data-t="ecs">Gestão TPV (ECs)</button>
  <button data-t="banco">Banco</button>
  <button data-t="regras">Regras e ajustes</button>
</nav>
<main id="view"></main>
<div class="tip" id="tip"></div>

<script>
const D = /*__DATA__*/null;

/* ---------- utilidades ---------- */
const $ = (s, e = document) => e.querySelector(s);
const h = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf0 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits: 1});
const nf2 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const num = v => {                       // aceita "969.188 - 71%" (VGA) e números
  if (typeof v === 'number') return v;
  if (typeof v === 'string') { const m = v.match(/^\s*(-?[\d.]+)\s*-\s*(-?\d+)%/); if (m) return parseFloat(m[1].replace(/\./g, '')); }
  return null;
};
const vgaPct = v => { const m = typeof v === 'string' && v.match(/-\s*(-?\d+)%/); return m ? +m[1] : null; };
const fmtInt = v => v == null ? '–' : nf0.format(v);
const fmtMoney = (v, d = 0) => v == null ? '–' : (d ? nf2.format(v) : nf0.format(v));
const fmtPct = v => v == null ? '–' : nf1.format(v * 100) + '%';
function brlC(v) {                       // compacto: R$ 1,5 mi
  if (v == null) return '–'; const a = Math.abs(v);
  if (a >= 1e6) return 'R$ ' + nf2.format(v / 1e6).replace(/,00$/, '') + ' mi';
  if (a >= 1e3) return 'R$ ' + nf1.format(v / 1e3) + ' mil';
  return 'R$ ' + nf0.format(v);
}
const dmy = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const dmyFull = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const LS = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- modelo ---------- */
const cols = D.cols;
const monthIdx = cols.map((c, i) => c.t === 'm' ? i : -1).filter(i => i >= 0);
const monthRange = mi => { const k = monthIdx.indexOf(mi); return [k ? monthIdx[k - 1] + 1 : 0, mi]; };
const monthDays = mi => { const [a, b] = monthRange(mi); const r = []; for (let i = a; i < b; i++) if (cols[i].t === 'd') r.push(i); return r; };
const monthWeeks = mi => { const [a, b] = monthRange(mi); const r = []; for (let i = a; i < b; i++) if (cols[i].t === 'w') r.push(i); return r; };
const monthLabel = mi => cols[mi].l;

function rowOf(block, secPre, re) {
  return D.blocks[block].find(r => r.s.toUpperCase().startsWith(secPre.toUpperCase()) && re.test(r.l)) || null;
}
const R = (secPre, re) => rowOf(S.block, secPre, re);
const V = (row, i) => row ? num(row.v[i]) : null;

// último dia com TPV realizado > 0 (interno)
const tpvRow0 = rowOf('interna', 'TPV TOTAL', /^TPV Realizado/);
let lastDayIdx = -1;
cols.forEach((c, i) => { if (c.t === 'd' && (tpvRow0.v[i] ?? 0) > 0) lastDayIdx = i; });
const lastDate = lastDayIdx >= 0 ? cols[lastDayIdx].d : null;
const monthOfIdx = i => monthIdx.find(m => m >= i);
const lastMonthIdx = lastDayIdx >= 0 ? monthOfIdx(lastDayIdx) : monthIdx[monthIdx.length - 1];
const isPartial = mi => mi === lastMonthIdx && lastDayIdx < monthDays(mi).slice(-1)[0];

/* ---------- estado ---------- */
const S = { block: LS.get('blk', 'interna'), month: +LS.get('mon', lastMonthIdx), tab: LS.get('tab', 'geral'), gran: LS.get('gran', 'mes'), collapsed: {} };
if (!monthIdx.includes(S.month)) S.month = lastMonthIdx;

/* ---------- gráficos SVG ---------- */
const SER = i => `var(--s${(i % 8) + 1})`;
function niceTicks(min, max, n = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * p).find(s => s >= raw);
  const t0 = Math.floor(min / step) * step, t = [];
  for (let v = t0; v <= max + step * .999; v += step) t.push(+v.toFixed(10)); return t;
}
let chartSeq = 0;
/* cfg: {x:[labels], series:[{name,data,type:'bar'|'line',color}], stacked, fmt, axFmt, height, tipExtra(i)} */
function chart(cfg) {
  const id = 'ch' + (++chartSeq), W = 640, Ht = cfg.height || 240, m = {l: 72, r: 10, t: 10, b: 24};
  const n = cfg.x.length, bars = cfg.series.filter(s => s.type === 'bar'), stacked = cfg.stacked && bars.length > 1;
  let lo = 0, hi = 0;
  cfg.x.forEach((_, i) => {
    let pos = 0, neg = 0;
    cfg.series.forEach(s => { const v = s.data[i]; if (v == null) return;
      if (s.type === 'bar' && stacked) { v >= 0 ? pos += v : neg += v; } else { hi = Math.max(hi, v); lo = Math.min(lo, v); } });
    hi = Math.max(hi, pos); lo = Math.min(lo, neg);
  });
  const ticks = niceTicks(lo, hi || 1), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const iw = W - m.l - m.r, ih = Ht - m.t - m.b;
  const X = i => m.l + (n === 1 ? iw / 2 : (iw * (i + .5)) / n), Y = v => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
  const bw = Math.max(2, Math.min(28, (iw / n) * (stacked ? .62 : .7) / (stacked ? 1 : Math.max(1, bars.length))));
  let g = ticks.map(t => `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${h((cfg.axFmt || fmtInt)(t))}</text>`).join('');
  if (y0 < 0) g += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  const every = Math.ceil(n / 12);
  cfg.x.forEach((l, i) => { if (i % every === 0) g += `<text x="${X(i)}" y="${Ht - 6}" text-anchor="middle">${h(l)}</text>`; });
  // barras
  const bi = {}; bars.forEach((s, k) => bi[s.name] = k);
  cfg.x.forEach((_, i) => {
    let pos = 0, neg = 0;
    bars.forEach((s, k) => { const v = s.data[i]; if (v == null || v === 0) return;
      let a, b, x;
      if (stacked) { x = X(i) - bw / 2; if (v >= 0) { a = pos; pos += v; b = pos; } else { a = neg; neg += v; b = neg; } }
      else { x = X(i) - (bw * bars.length) / 2 + k * bw; a = 0; b = v; }
      const top = Math.min(Y(a), Y(b)), hgt = Math.max(1, Math.abs(Y(a) - Y(b)) - (stacked ? 2 : 0));
      const w = bw - (stacked ? 0 : 2);
      g += `<rect x="${x.toFixed(1)}" y="${(stacked && v >= 0 ? top + 2 : top).toFixed(1)}" width="${w.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${s.color || SER(cfg.series.indexOf(s))}"/>`;
    });
  });
  // linhas
  cfg.series.forEach((s, si) => { if (s.type !== 'line') return;
    const c = s.color || SER(si); let d = '', pen = false;
    s.data.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
    if (n <= 16) s.data.forEach((v, i) => { if (v != null) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  g += `<line class="ax" id="${id}x" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" style="stroke:var(--ink-3);display:none"/>`;
  g += `<rect id="${id}o" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" data-chart="${id}"/>`;
  charts[id] = {cfg, X, n, m, iw, W};
  const lg = cfg.series.length > 1 ? `<div class="legend">${cfg.series.map((s, si) => `<span><i class="${s.type === 'line' ? 'ln' : ''}" style="background:${s.color || SER(si)}"></i>${h(s.name)}</span>`).join('')}</div>` : '';
  const anyData = cfg.series.some(s => s.data.some(v => v != null && v !== 0));
  return `<div class="chartwrap" id="w${id}">${lg}${anyData ? `<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="${h(cfg.title || '')}">${g}</svg>` : '<div class="empty">Sem dados no período</div>'}</div>`;
}
const charts = {};
const cardData = {};
function chartCard(title, sub, cfg) {
  const html = chart({...cfg, title});
  const k = chartSeq; cardData[k] = cfg;
  return `<div class="card"><div class="head"><div><h3>${h(title)}</h3><div class="sub">${h(sub || '')}</div></div><button class="linkbtn" data-tbl="${k}">tabela</button></div>${html}<div id="tb${k}" hidden></div></div>`;
}
function tableOf(cfg) {
  const f = cfg.fmt || fmtInt;
  return `<div class="tablewrap" style="max-height:260px;margin-top:8px"><table><tr><th class="txt"></th>${cfg.series.map(s => `<th>${h(s.name)}</th>`).join('')}</tr>${cfg.x.map((l, i) => `<tr><td class="txt">${h(l)}</td>${cfg.series.map(s => `<td>${s.data[i] == null ? '–' : h(f(s.data[i]))}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
// tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const o = e.target.closest && e.target.closest('rect[data-chart]');
  if (!o) { tip.style.display = 'none'; document.querySelectorAll('svg line[id$="x"]').forEach(l => l.style.display = 'none'); return; }
  const id = o.dataset.chart, c = charts[id], svg = o.ownerSVGElement, r = svg.getBoundingClientRect(), sc = r.width / c.W;
  const px = (e.clientX - r.left) / sc, i = Math.max(0, Math.min(c.n - 1, Math.floor(((px - c.m.l) / c.iw) * c.n)));
  const cfg = c.cfg, f = cfg.fmt || fmtInt, ln = $('#' + id + 'x'); ln.setAttribute('x1', c.X(i)); ln.setAttribute('x2', c.X(i)); ln.style.display = '';
  let tot = 0, body = cfg.series.map((s, si) => { const v = s.data[i]; if (v != null && s.type === 'bar') tot += v;
    return v == null ? '' : `<div><i style="background:${s.color || SER(si)}"></i>${h(s.name)}: <b>${h(f(v))}</b>${cfg.share && tot >= 0 ? '' : ''}</div>`; }).join('');
  if (cfg.stacked) body += `<div style="margin-top:3px;color:var(--ink-3)">Total: <b style="color:var(--ink)">${h(f(cfg.series.filter(s => s.type === 'bar').reduce((a, s) => a + (s.data[i] || 0), 0)))}</b></div>`;
  tip.innerHTML = `<div class="t">${h(cfg.xFull ? cfg.xFull[i] : cfg.x[i])}</div>${body}`;
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight; let x = e.pageX + 14, y = e.pageY + 14;
  if (x + tw > scrollX + innerWidth - 8) x = e.pageX - tw - 14; if (y + th > scrollY + innerHeight - 8) y = e.pageY - th - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.position = 'absolute';
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tbl]'); if (!b) return;
  const k = b.dataset.tbl, box = $('#tb' + k); if (!box) return;
  if (box.hidden) { box.innerHTML = tableOf(cardData[k]); box.hidden = false; b.textContent = 'ocultar tabela'; } else { box.hidden = true; b.textContent = 'tabela'; }
});

/* ---------- Visão geral ---------- */
function kpi(label, row, mi, kind, opt = {}) {
  const v = row ? (kind === 'pct' ? row.v[mi] : V(row, mi)) : null, k = monthIdx.indexOf(mi), prev = k ? monthIdx[k - 1] : null;
  const pv = prev != null && row ? (kind === 'pct' ? row.v[prev] : V(row, prev)) : null;
  const fmt = kind === 'money' ? brlC : kind === 'pct' ? fmtPct : kind === 'dec' ? (x => x == null ? '–' : nf1.format(x)) : fmtInt;
  let d = '';
  const partialSum = opt.sum && isPartial(mi);
  if (partialSum) d = `parcial até ${dmy(lastDate)}`;
  else if (v != null && pv != null && pv !== 0) {
    const dl = kind === 'pct' ? (v - pv) * 100 : ((v - pv) / Math.abs(pv)) * 100, good = opt.inverse ? dl < 0 : dl > 0;
    d = `<b class="${Math.abs(dl) < .05 ? '' : good ? 'up' : 'down'}">${dl > 0 ? '▲' : dl < 0 ? '▼' : '='} ${nf1.format(Math.abs(dl))}${kind === 'pct' ? ' p.p.' : '%'}</b> vs ${monthLabel(prev)}`;
  } else d = prev != null ? `sem base em ${monthLabel(prev)}` : '';

function series(row, idxs) { return idxs.map(i => row ? V(row, i) : null); }

/* ---------- Report (tabela) ---------- */
function cellKind(r) {
  if (r.a === '%') return 'pct';
  const s = r.s.toUpperCase();
  if (s.startsWith('ESTABELECIMENTOS') || s.startsWith('ATENDIMENTO')) return 'int';
  if (s.startsWith('TERMINAIS')) return /^Custo/.test(r.l) ? 'm2' : 'int';
  return 'm0';
}
function fmtCell(r, v, kind) {
  if (v == null || v === '') return '<span class="mut">–</span>';
  if (typeof v === 'string') return h(v);
  if (kind === 'pct') return fmtPct(v);
  if (kind === 'int') return Number.isInteger(v) ? nf0.format(v) : nf1.format(v);
  if (kind === 'm2') return nf2.format(v);
  if (r.a === 'Mensal' && Math.abs(v) < 1 && /Rentabilidade (DOCK|Fiserv)/.test(r.l)) return fmtPct(v);
  return nf2.format(v).replace(/,00$/, '');
}
function renderReport() {
  const mi = S.month;
  let idxs;
  if (S.gran === 'meses') idxs = monthIdx;
  else { const [a, b] = monthRange(mi); idxs = []; for (let i = a; i <= b; i++) if (S.gran === 'mes' || cols[i].t !== 'd') idxs.push(i); }
  const head = idxs.map(i => { const c = cols[i]; const t = c.t === 'd' ? dmy(c.d) : c.l; return `<th class="${c.t === 'w' ? 'wk' : ''}">${h(t)}${c.t === 'd' ? '<br><span class="mut" style="font-weight:400">' + ['dom','seg','ter','qua','qui','sex','sáb'][new Date(c.d + 'T12:00').getDay()] + '</span>' : ''}</th>`; }).join('');
  let body = '', lastSec = null;
  D.blocks[S.block].forEach(r => {
    if (r.s !== lastSec) { lastSec = r.s; const cl = S.collapsed[r.s]; body += `<tr class="sec" data-sec="${h(r.s)}"><td colspan="${idxs.length + 2}">${cl ? '▸' : '▾'} ${h(r.s)}</td></tr>`; }
    if (S.collapsed[r.s]) return;
    const k = cellKind(r);
    body += `<tr><td class="sticky c0">${h(r.l)}</td><td class="sticky c1">${h(r.a)}</td>${idxs.map(i => { const c = cols[i]; return `<td class="${c.t === 'w' ? 'wk' : c.t === 'm' ? 'mo' : ''}">${fmtCell(r, r.v[i], k)}</td>`; }).join('')}</tr>`;
  });
  return `<div class="filters">
    <div class="seg" id="segGran" style="border-color:var(--line)">${[['mes','Dias + semanas + mês'],['sem','Semanas + mês'],['meses','Todos os meses']].map(([k, l]) => `<button data-g="${k}" aria-pressed="${S.gran === k}" style="color:var(--ink)">${l}</button>`).join('')}</div>
    <span class="note" style="margin:0">Clique no título de uma seção para recolher. A coluna "Agreg." indica como semana/mês agregam os dias.</span></div>
    <div class="tablewrap"><table><thead><tr><th class="txt c0 sticky">Indicador</th><th class="txt c1 sticky">Agreg.</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- Gestão TPV (ECs) ---------- */
const G = {q: '', ad: '', canal: '', safra: '', novo: '', par: 0, sort: -1, dir: -1};
function renderEcs() {
  const H = D.gestao.h, hi = n => H.findIndex(x => x && String(x).startsWith(n));
  const iN = hi('Nome'), iF = hi('Franqueado'), iC = hi('Canal'), iA = hi('Adquirente'), iS = hi('Safra'), iNv = hi('Novo'), iCt = hi('TPV Contratado'), iAt = hi('Data de ativação');
  const iM = H.map((x, i) => /^TPV (Jul|Ago|Set|Out|Jan|Fev|Mar|Abr|Mai|Jun|Nov|Dez)/.test(x || '') ? i : -1).filter(i => i >= 0);
  const iD = H.length - 1;
  const uniq = i => [...new Set(D.gestao.r.map(r => r[i]).filter(Boolean))].sort();
  const sel = (id, i, lab, v) => `<label>${lab} <select data-f="${id}"><option value="">Todos</option>${uniq(i).map(o => `<option${o === v ? ' selected' : ''}>${h(o)}</option>`).join('')}</select></label>`;
  let rows = D.gestao.r.filter(r => (!G.q || (r[iN] + ' ' + (r[iF] || '')).toLowerCase().includes(G.q.toLowerCase())) && (!G.ad || r[iA] === G.ad) && (!G.canal || r[iC] === G.canal) && (!G.safra || r[iS] === G.safra) && (!G.novo || r[iNv] === G.novo) && (!G.par || (r[iD] ?? -1) >= G.par));
  if (G.sort >= 0) rows = rows.slice().sort((a, b) => { const x = a[G.sort], y = b[G.sort]; if (x == null || y == null) return (x == null) - (y == null); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * G.dir; });
  const all = D.gestao.r, par3 = all.filter(r => (r[iD] ?? 0) >= 3).length, last = iM[iM.length - 1];
  const sumLast = all.reduce((a, r) => a + (r[last] || 0), 0);
  const cols_ = [iN, iF, iC, iA, iS, iCt, ...iM, iAt, iD];
  const dayHdr = H[iD];
  return `<div class="chips">
      <div class="chip"><b>${fmtInt(all.length)}</b>ECs ativos (linhas Dock + Fiserv)</div>
      <div class="chip"><b>${fmtInt(all.filter(r => r[iC] === 'Franquia').length)}</b>de franquias</div>
      <div class="chip"><b>${fmtInt(par3)}</b>há 3+ dias sem transacionar</div>
      <div class="chip"><b>${brlC(sumLast)}</b>${h(H[last])}</div></div>
    <div class="filters"><input type="search" id="gq" placeholder="Buscar EC ou franqueado…" value="${h(G.q)}" style="min-width:240px">
      ${sel('ad', iA, 'Adquirente', G.ad)}${sel('canal', iC, 'Canal', G.canal)}${sel('safra', iS, 'Safra', G.safra)}${sel('novo', iNv, 'Novo credenciamento', G.novo)}
      <label>Dias sem transacionar ≥ <input type="number" min="0" id="gpar" value="${G.par}" style="width:70px"></label>
      <span class="note" style="margin:0">${fmtInt(rows.length)} de ${fmtInt(all.length)}</span></div>
    <div class="tablewrap"><table><thead><tr>${cols_.map(i => `<th class="sortable ${i <= iA || i === iS ? 'txt' : ''}" data-s="${i}">${h(i === iD ? 'Dias sem transacionar (' + dmy(dayHdr) + ')' : H[i])}${G.sort === i ? (G.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols_.map(i => { const v = r[i]; let c = ''; if (i === iD && v != null) c = v >= 30 ? 'pill b' : v >= 3 ? 'pill w' : ''; const txt = [iN, iF, iC, iA, iS].includes(i);
      const s = v == null ? '<span class="mut">–</span>' : (i === iAt ? dmyFull(v) : typeof v === 'number' ? (i === iD ? nf0.format(v) : nf2.format(v).replace(/,00$/, '')) : h(v));

    <div class="note">${h(D.gestaoNote || '')}<br>CNPJ, telefone e e-mail dos ECs não são carregados neste painel.</div>`;
}

/* ---------- shell ---------- */
function paintMeta() {

  const stale = m && upd.slice(0, 10) !== today;
  $('#meta').innerHTML = `<span class="badge ${stale ? 'stale' : ''}">${stale ? '⚠ ' : '✓ '}Planilha atualizada em ${h(upd)}${stale ? ' (não é de hoje)' : ''}</span><span>dados até ${dmyFull(lastDate)}</span><span>painel gerado em ${h(D.gen)}</span>`;
}
function render() {
  document.querySelectorAll('#segBlock button').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === S.block));

(function init() {

  $('#selMonth').onchange = e => { S.month = +e.target.value; LS.set('mon', S.month); render(); };
  $('#segBlock').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.block = b.dataset.b; LS.set('blk', S.block); render(); };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; LS.set('tab', S.tab); render(); };
  $('#btnTheme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; LS.set('theme', r.dataset.theme); };
  const th = LS.get('theme', ''); if (th) document.documentElement.dataset.theme = th;
  const v = $('#view');
  v.addEventListener('click', e => {
    const g = e.target.closest('[data-g]'); if (g) { S.gran = g.dataset.g; LS.set('gran', S.gran); render(); return; }
    const s = e.target.closest('tr.sec'); if (s) { S.collapsed[s.dataset.sec] = !S.collapsed[s.dataset.sec]; render(); return; }
    const so = e.target.closest('th[data-s]'); if (so) { const i = +so.dataset.s; G.dir = G.sort === i ? -G.dir : -1; G.sort = i; render(); }
  });
  v.addEventListener('input', e => {
    const t = e.target; let f = false;
    if (t.id === 'gq') { G.q = t.value; f = 1; } else if (t.id === 'gpar') { G.par = +t.value || 0; f = 1; } else if (t.id === 'rq') { RQ.q = t.value; f = 1; } else if (t.dataset.f) { G[t.dataset.f] = t.value; f = 1; }
    if (!f) return; const pos = t.selectionStart, id = t.id; render(); if (id) { const n = document.getElementById(id); n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} }
  });
  render();
})();
</script>
</body>
</html>
